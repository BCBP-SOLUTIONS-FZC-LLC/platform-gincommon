server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: platform-gincommon
    static_configs:
      - targets:
          - localhost
        labels:
          job: platform-gincommon
          service: platform-gincommon
          __path__: /var/log/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            trace_id: trace_id
            request_id: request_id
            tenant_id: tenant_id
            user_id: user_id
            method: method
            path: path
            status: status
      - labels:
          level:
          trace_id:
          request_id:
