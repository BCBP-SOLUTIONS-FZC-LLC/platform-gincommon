# Reusable validation workflow — called by ci.yml and release.yml.
# Runs: checkout → Go setup → mod verify → fmt → tidy drift → vet → lint → vulncheck → race detector
#
# The "Race Detector" step is a mandatory blocking gate: it runs the full test
# suite (unit + integration + e2e) with Go's -race flag. Any data race detected
# fails this job, which blocks all downstream jobs (coverage, build, docker,
# release). The step is intentionally named to be unambiguous in CI dashboards.
name: Validate

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Format check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt violations:"
            echo "$files"
            exit 1
          fi

      - name: Tidy check
        run: |
          make tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Vulnerability check
        # Scope to library packages only — cmd/server is a demo binary and its
        # stdlib call graph (net/tls, html/template) produces noise, not library risk.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./internal/... ./pkg/...

      # ── Mandatory gate ────────────────────────────────────────────────────
      # This step MUST pass before any downstream job (coverage, build, docker,
      # release) can run. A data race detected here is a blocking failure.
      # Do NOT remove -race or skip this step for a "faster" CI run.
      - name: Race Detector — unit · integration · e2e
        run: make race
