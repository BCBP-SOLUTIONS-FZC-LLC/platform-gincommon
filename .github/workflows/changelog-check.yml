# Pre-merge CHANGELOG check.
# Fails if a PR changes library or tooling code without updating CHANGELOG.md,
# so release.yml's CHANGELOG gate never surprises anyone at tag time.
name: Changelog check

"on":
  pull_request:
    paths:
      - 'internal/**'
      - 'pkg/**'
      - 'cmd/**'
      - 'go.mod'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: CHANGELOG updated in this PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Three dots: only this PR's changes since the merge base, not
          # CHANGELOG edits that landed on main after the branch point.
          if git diff --name-only "$BASE...$HEAD" | grep -q '^CHANGELOG\.md$'; then
            echo "CHANGELOG.md updated in this PR — OK."
          else
            echo "::error file=CHANGELOG.md,title=CHANGELOG not updated::This PR changes internal/, pkg/, cmd/ or go.mod but does not update CHANGELOG.md. Add an entry under the Unreleased section before merging."
            exit 1
          fi
