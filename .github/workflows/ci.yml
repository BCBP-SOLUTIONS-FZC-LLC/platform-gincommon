# CI for https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-gincommon
#
# platform-gincommon is a private Go library; the only image is the demo /
# reference server (cmd/server), never a production artefact.
#
# Parallel flow:
#
#   validate-test ──────┐──► interop
#   build-image ────────┤──► trivy ──────┐
#                       │   smoke ───────┤──► pr-summary (PR events only)
#                       └────────────────┤──► push       (push events only, needs quality too)
#   validate-quality ───────────────────┘
#
# build-image lints the Dockerfile (Hadolint + .dockerignore check) as its
# first steps, before the expensive build — a lint failure never starts the
# build, and there's no separate lint-dockerfile job to pay a job-minute for.
# validate-test runs the race+coverage gate and gates trivy/smoke/interop.
# validate-quality (style, lint, observability standard, vulns) gates push only.
# pr-summary posts or updates one status table on every pull_request run, pass or fail.
#
# paths-ignore skips this entire pipeline for commits that only touch
# Markdown or the mermaid diagrams — those can't affect test/build outcomes.
# A commit that touches both docs and code still runs normally (paths-ignore
# only skips when EVERY changed file matches).
#
name: CI

"on":
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'docs/architecture/**']
  pull_request:
    branches: [main, master]
    paths-ignore: ['**.md', 'docs/architecture/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE_NAME: ghcr.io/bcbp-solutions-fzc-llc/platform-gincommon
  BUILDKIT_PROGRESS: plain

jobs:
  # ── runs in parallel with validate-quality + build-image ─────────────────
  validate-test:
    name: Validate / Test
    uses: ./.github/workflows/validate-test.yml
    secrets: inherit

  # ── runs in parallel with validate-test + build-image ────────────────────
  validate-quality:
    name: Validate / Quality
    uses: ./.github/workflows/validate-quality.yml
    secrets: inherit

  # ── runs in parallel with validate-test + validate-quality ───────────────
  # Lints the Dockerfile as its first steps — a hadolint failure exits before
  # the expensive build ever starts, no separate job/job-minute needed.
  build-image:
    name: Build image (cache)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      # DL3018 (pin apk package versions) is ignored: both base images are
      # digest-pinned (validate-quality enforces it), which already makes the
      # build reproducible.
      - name: Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          ignore: DL3018

      - name: Check .dockerignore exists
        run: test -f .dockerignore

      # SOURCE_DATE_EPOCH + cache targets (grouped in docker-build-prep.sh).
      - name: Prepare Docker build
        id: cache
        env:
          REGISTRY_REF: ${{ env.IMAGE_NAME }}:buildcache
          CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash .github/scripts/docker-build-prep.sh

      # Log in so registry cache reads (and writes on non-fork runs) are authenticated.
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # Build and write all layers to GHA + registry cache (no local load needed here).
      - name: Build image → cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          # Feeds downstream trivy/smoke, which load amd64 images.
          platforms: linux/amd64
          push: false
          load: false
          # Pull fresh base image on push/manual runs; skip on PRs for speed.
          pull: ${{ github.event_name != 'pull_request' }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.cache.outputs.SOURCE_DATE_EPOCH }}

  # ── gates on build-image, runs in parallel with smoke ─────────────────────
  trivy:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: [validate-test, build-image]
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # Restore from GHA cache (all layers cached → near-instant rebuild).
      - name: Load image from cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: platform-gincommon-ci-test
          cache-from: type=gha
          build-args: BUILD_VERSION=${{ github.sha }}

      - name: Cache Trivy DB
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: /tmp/trivy-cache
          key: trivy-db-${{ runner.os }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Table format: human-readable in CI logs; fails on CRITICAL/HIGH/UNKNOWN.
      - name: Trivy scan — CRITICAL / HIGH / UNKNOWN
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: platform-gincommon-ci-test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH,UNKNOWN
          ignore-unfixed: true
          cache-dir: /tmp/trivy-cache

      # SARIF format: uploads to GitHub Security tab.
      - name: Trivy scan — SARIF upload
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: platform-gincommon-ci-test
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          cache-dir: /tmp/trivy-cache

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      # CycloneDX SBOM — full component inventory for compliance / audit.
      - name: Trivy SBOM — CycloneDX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: platform-gincommon-ci-test
          format: cyclonedx
          output: sbom.cyclonedx.json
          exit-code: '0'
          cache-dir: /tmp/trivy-cache

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

  # ── gates on validate-test + build-image, runs in parallel with trivy ────
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [validate-test, build-image]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # Restore from GHA cache (all layers cached → near-instant rebuild).
      - name: Load image from cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: platform-gincommon-ci-test
          cache-from: type=gha
          build-args: BUILD_VERSION=${{ github.sha }}

      # Image size, fail-fast on an invalid observability identity, /health,
      # and the platform_* metrics on /metrics.
      - name: Smoke tests
        run: bash .github/scripts/smoke-tests.sh

  # ── cross-language compatibility (platform-interop-tests) ─────────────────
  interop:
    name: Cross-language compatibility
    needs: validate-test
    uses: BCBP-SOLUTIONS-FZC-LLC/platform-interop-tests/.github/workflows/interop.yml@c7e62e6976274ed4cf9c78f86b5f58467e59afc2 # main 2026-10-02 (no tags yet)
    with:
      # This repo's own PR/branch ref; the other five default to their main branch (see
      # platform-interop-tests/README.md for why).
      platform_gincommon_ref: ${{ github.head_ref || github.ref_name }}
    secrets:
      # Requires a secret with read access across all six libraries. This org uses
      # GO_PRIVATE_TOKEN (already defined) for that; interop.yml's own input is
      # still named `gh_private_token` per its workflow_call contract.
      gh_private_token: ${{ secrets.GO_PRIVATE_TOKEN }}

  # ── posts or updates a single comment on every PR push ───────────────────
  pr-summary:
    name: PR summary
    runs-on: ubuntu-latest
    needs: [validate-test, validate-quality, build-image, trivy, smoke]
    # always(): post the result on failure too, so an earlier "ready to merge"
    # comment is replaced instead of left standing after a failing push.
    if: always() && github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Post or update summary comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const fs = require('fs')
            const code = fs.readFileSync('.github/scripts/pr-summary.js', 'utf8')
            const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor
            const run = new AsyncFunction('github', 'context', 'core', 'require', 'process', code)
            await run(github, context, core, require, process)

  # ── push the demo image to GHCR on merge to main ─────────────────────────
  push:
    name: Push demo image → GHCR
    runs-on: ubuntu-latest
    needs: [validate-test, trivy, smoke, validate-quality]
    if: github.event_name == 'push'
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set SOURCE_DATE_EPOCH
        id: sde
        run: bash .github/scripts/set-source-date-epoch.sh

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push
        id: pushed
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          # amd64-only, matching release.yml's docker job.
          platforms: linux/amd64
          pull: true
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=dev-${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.SOURCE_DATE_EPOCH }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing via Sigstore OIDC — no long-lived key to rotate or leak.
      # Verifiable with: cosign verify --certificate-identity-regexp ACTOR \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #   ghcr.io/bcbp-solutions-fzc-llc/platform-gincommon@DIGEST
      - name: Sign image with Cosign
        run: |
          cosign sign --yes \
            "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/.github/workflows/.*@refs/heads/(main|master)$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      - name: Log image digest
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .github/scripts/log-image-digest.sh
